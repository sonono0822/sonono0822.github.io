<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303653"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Desk Clock"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Pixel Desk Clock</title></head><body><div class="world" id="world"><div class="stars"></div><div class="orb"></div><div class="cloud a"></div><div class="cloud b"></div><div class="city"></div><main><section class="clock-zone"><div id="greeting"></div><div id="clock">00:00</div><div id="date"></div><div class="petzone"><div id="speech">おつかれさま...</div><img id="pet" src="character.jpeg"></div></section><section class="calendar" id="calendar"><header><button id="prev">‹</button><h1 id="month"></h1><button id="next">›</button></header><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days"></div><footer><button id="today">TODAY</button><span>↑ 次月　↓ 前月</span></footer></section></main><nav class="dev"><button data-scene="auto">AUTO</button><button data-scene="morning">朝</button><button data-scene="day">昼</button><button data-scene="evening">夕</button><button data-scene="night">夜</button></nav></div><script src="app.js"></script></body></html>
