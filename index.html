      </div>
    </section>

    <section class="calendar-panel" id="calendarPanel">

        <button id="prev" aria-label="前月">‹</button><h1 id="month"></h1><button id="next" aria-label="次月">›</button>
      </header>

      <div class="days" id="days"></div>
      <footer><button id="today">TODAY</button><span>↑ NEXT　↓ PREV</span></footer>
    </section>
  </main>
