<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b3e63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Clock">
  <title>Pixel Desk Clock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="world evening" id="world">
  <div class="sky-stars"></div><div class="sun-moon"></div>
  <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
  <div class="city city-far"></div><div class="city city-mid"></div><div class="city city-near"></div>
  <div class="city-lights"></div><div class="rail"></div>

  <main class="dashboard">
    <section class="clock-side">
      <div class="greeting" id="greeting"></div>
      <div class="pixel-clock" id="pixelClock" aria-label="現在時刻"></div>
      <div class="date" id="date"></div>
      <div class="pet-home" id="petHome">
        <div class="bubble" id="bubble"></div>
        <div class="pet" aria-hidden="true">
          <i class="ear left"></i><i class="ear right"></i><i class="hood"></i>
          <i class="face"></i><i class="eye left"></i><i class="eye right"></i>
          <i class="body"></i><i class="ribbon"></i>
        </div>
      </div>
    </section>

    <section class="calendar-panel" id="calendarPanel">
      <header class="cal-head">
        <button id="prev" aria-label="前月">‹</button><h1 id="month"></h1><button id="next" aria-label="次月">›</button>
      </header>
      <div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div class="days" id="days"></div>
      <footer><button id="today">TODAY</button><span>↑ NEXT　↓ PREV</span></footer>
    </section>
  </main>

  <details class="dev-panel"><summary>◆</summary><div>
    <button data-scene="auto">AUTO</button><button data-scene="morning">朝</button>
    <button data-scene="day">昼</button><button data-scene="evening">夕</button><button data-scene="night">夜</button>
  </div></details>
</div>
<script src="app.js"></script>
</body></html>
